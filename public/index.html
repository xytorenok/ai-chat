<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.5 Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Gemini 2.5 Flash</h1>
        </header>
        
        <div id="messages" class="messages-area">
            <div class="message ai">Привет! Я Gemini версии 2.5. Чем могу помочь?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Введите сообщение..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
